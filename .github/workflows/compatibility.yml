name: Storage
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.*', 'rust-toolchain.toml', 'dev/**', 'scripts/dev*', 'scripts/e2e-storage.py', 'scripts/test-storage-e2e.py', '.github/workflows/compatibility.yml']
  schedule:
    - cron: '17 8 * * 3'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Test all supported Kubernetes versions (otherwise baseline only).
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
jobs:
  build:
    name: build-${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - uses: ./.github/actions/rust-cache
        with:
          group: compatibility-gnu
      - name: Build once per native architecture
        run: |
          python3 scripts/check-toolchain.py
          cargo build --locked --release
          python3 scripts/test-credential-terminal.py --binary target/release/kubectl-view_storage
          mkdir -p artifacts/compatibility-build
          tar -czf artifacts/compatibility-build/binary.tar.gz -C target/release kubectl-view_storage
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          binary = Path('target/release/kubectl-view_storage').read_bytes()
          Path('artifacts/compatibility-build/source.json').write_text(json.dumps({'revision': os.environ['GITHUB_SHA'], 'architecture': platform.machine(), 'binary_sha256': hashlib.sha256(binary).hexdigest()}) + '\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: compatibility-binary-${{ matrix.os }}
          path: artifacts/compatibility-build/
          retention-days: 3
          if-no-files-found: error
  live:
    name: k8s-${{ matrix.kubernetes }}-${{ matrix.arch }}
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        kubernetes: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full_matrix)) && '["1.37.0"]' || '["1.37.0","1.36.4","1.35.8"]') }}
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Select reviewed node and matching client
        id: selection
        env:
          SELECTED_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          python3 - <<'PY'
          import json, os
          versions = json.load(open('dev/versions.json'))
          selected = os.environ['SELECTED_KUBERNETES']
          image = next(pin for pin in [versions['baseline_node'], *versions['compatibility_nodes']]
                       if pin.split(':v', 1)[1].split('@', 1)[0] == selected)
          client = versions['kubectl'] if image == versions['baseline_node'] else selected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image={image}\nkubectl=v{client}\n')
          PY
      - uses: azure/setup-kubectl@v5.2.0
        with:
          version: ${{ steps.selection.outputs.kubectl }}
      - name: Install verified kind binary
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, re, urllib.request
          from pathlib import Path
          version = json.load(open('dev/versions.json'))['kind']
          arch = {'x86_64': 'amd64', 'aarch64': 'arm64'}[platform.machine()]
          asset = f'kind-linux-{arch}'
          base = f'https://github.com/kubernetes-sigs/kind/releases/download/v{version}/{asset}'
          with urllib.request.urlopen(base + '.sha256sum', timeout=60) as response:
              checksum = response.read(4096).decode().split()[0]
          if not re.fullmatch('[0-9a-f]{64}', checksum):
              raise RuntimeError('invalid kind checksum')
          with urllib.request.urlopen(base, timeout=120) as response:
              binary = response.read(32 * 1024 * 1024 + 1)
          if len(binary) > 32 * 1024 * 1024 or hashlib.sha256(binary).hexdigest() != checksum:
              raise RuntimeError('kind checksum/size mismatch')
          directory = Path('.local/tools/bin').resolve()
          directory.mkdir(parents=True, exist_ok=True)
          path = directory / 'kind'
          path.write_bytes(binary)
          path.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(directory) + '\n')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          name: compatibility-binary-${{ matrix.os }}
          path: .local/compatibility-artifact
      - name: Verify same-revision binary built for this architecture
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, tarfile
          from pathlib import Path
          source = Path('.local/compatibility-artifact')
          receipt = json.loads((source / 'source.json').read_text())
          assert receipt['revision'] == os.environ['GITHUB_SHA']
          assert receipt['architecture'] == platform.machine()
          with tarfile.open(source / 'binary.tar.gz') as archive:
              assert archive.getnames() == ['kubectl-view_storage']
              entry = archive.getmember('kubectl-view_storage')
              assert entry.isfile() and 0 < entry.size <= 128 * 1024 * 1024
              binary = archive.extractfile(entry).read()
          assert hashlib.sha256(binary).hexdigest() == receipt['binary_sha256']
          destination = Path('.local/compatibility-bin/kubectl-view_storage')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(binary)
          destination.chmod(0o755)
          PY
      - name: Local-path, CSI hostpath and cross-node NFS CSI
        env:
          SELECTED_NODE_IMAGE: ${{ steps.selection.outputs.image }}
        run: python3 scripts/e2e-storage.py --node-image "$SELECTED_NODE_IMAGE" --binary .local/compatibility-bin/kubectl-view_storage
      - name: Remove any remaining owned profiles
        if: always()
        run: |
          failed=0
          for profile in inventory csi nfs; do
            if [ -f ".local/clusters/$profile.json" ]; then
              python3 scripts/dev-cluster.py delete "$profile" || failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.kubernetes }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
