name: Stable and dependency maintenance
on:
  pull_request:
    paths-ignore: ['**/*.md', 'examples/live/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'examples/live/**']
  schedule:
    - cron: '31 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
jobs:
  stable:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-toolchain.py --latest
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-deny
          version: '0.19.0'
      - name: Fresh advisory data with the cached executable
        run: |
          test -f Cargo.lock
          cargo deny --locked check advisories bans licenses sources
