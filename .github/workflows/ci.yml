name: Rust and contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: short
jobs:
  contracts:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      distribution: ${{ steps.scope.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dev/requirements-ci.txt
      - name: Select checks from changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-scope.py
      - name: Policy, workflow selection, and contract checks
        run: |
          python3 -m pip install -r dev/requirements-ci.txt
          python3 scripts/test-ci-scope.py
          python3 scripts/test-toolchain-check.py
          python3 scripts/test-ci-timings.py
          python3 scripts/test-ci-workflows.py
          python3 scripts/check-dependencies.py
          python3 scripts/test-dependency-check.py
          python3 scripts/validate-contract.py
          python3 scripts/test-coverage-check.py
          python3 scripts/test-dev-environment.py
          python3 scripts/test-csi-environment.py
          python3 scripts/test-storage-e2e.py
          python3 scripts/test-release-packaging.py
          python3 scripts/test-smoke-http.py
  lint:
    needs: contracts
    if: needs.contracts.outputs.rust == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - uses: ./.github/actions/rust-cache
        with:
          group: lint
      - name: Pinned compiler, formatting and lint
        run: |
          python3 scripts/check-toolchain.py
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
  stable:
    needs: contracts
    if: needs.contracts.outputs.rust == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve latest stable and avoid testing the same compiler twice
        id: compiler
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          python3 - <<'PY'
          import os, subprocess, tomllib
          pinned = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          differs = actual != pinned
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('differs=' + str(differs).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'### Stable compiler\n\nPinned: {pinned}; stable: {actual}. ' + ('Run compatibility tests.\n' if differs else 'Identical release; pinned coverage/native jobs supply the tests.\n'))
          PY
      - uses: ./.github/actions/rust-cache
        if: steps.compiler.outputs.differs == 'true'
        with:
          group: stable
      - name: New stable compiler compatibility
        if: steps.compiler.outputs.differs == 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python3 scripts/test-credential-terminal.py
  coverage:
    needs: contracts
    if: needs.contracts.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIEW_STORAGE_TEST_REPORTS: ${{ github.workspace }}/artifacts/api-reports
      VIEW_STORAGE_HTTP_REPORTS: ${{ github.workspace }}/artifacts/http-reports
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dev/requirements-ci.txt
      - name: Pinned compiler and LLVM tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - uses: ./.github/actions/rust-cache
        with:
          group: coverage
          workspaces: '. -> target/llvm-cov-target'
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-llvm-cov
          version: '0.9.1'
      - name: Full pinned GNU suite, coverage floors and independent reports
        run: |
          sh scripts/coverage.sh
          python3 -m pip install -r dev/requirements-ci.txt
          python3 scripts/validate-produced-reports.py artifacts/api-reports
          python3 scripts/validate-produced-reports.py --http artifacts/http-reports
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: artifacts/coverage
          retention-days: 7
          if-no-files-found: error
  faults:
    needs: contracts
    if: needs.contracts.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - uses: ./.github/actions/rust-cache
        with:
          group: fault-detection
          workspaces: '. -> artifacts/mutations/target'
      - run: python3 scripts/check-mutations.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: controlled-faults
          path: |
            artifacts/mutations/*.json
            artifacts/mutations/*.log
          retention-days: 7
          if-no-files-found: warn
  distribution:
    needs: contracts
    if: needs.contracts.outputs.distribution == 'true'
    uses: ./.github/workflows/native-distribution.yml
  required:
    if: always()
    needs: [contracts, lint, stable, coverage, faults, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Required checks, including intentional documentation skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['contracts']['result'] == 'success', results
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          rust = results['contracts']['outputs'].get('rust')
          assert rust in ('true', 'false'), results
          if rust == 'true':
              assert all(results[name]['result'] == 'success' for name in ('lint', 'stable', 'coverage', 'faults', 'distribution')), results
          print('PASS required checks; documentation-only skips are intentional')
          PY
