name: Native distribution validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_TARGET: ${{ matrix.target }}
      VIEW_STORAGE_TEST_REPORTS: ${{ github.workspace }}/artifacts/api-reports
      VIEW_STORAGE_HTTP_REPORTS: ${{ github.workspace }}/artifacts/http-reports
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Pinned native toolchain and musl C compiler
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "$RELEASE_TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes musl-tools
            echo 'CC=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi
          python3 scripts/check-toolchain.py
          python3 scripts/check-dependencies.py
      - name: Matching kubectl
        id: kubectl_pin
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('version=v'+json.load(open('dev/versions.json'))['kubectl']+'\n')
          PY
      - uses: azure/setup-kubectl@v5.2.0
        with:
          version: ${{ steps.kubectl_pin.outputs.version }}
      - name: Actual native target tests and terminal helpers
        run: |
          python3 scripts/test-smoke-http.py
          cargo test --locked --all-targets --target "$RELEASE_TARGET"
          python3 scripts/test-credential-terminal.py --binary "target/$RELEASE_TARGET/debug/kubectl-view_storage"
          python3 scripts/check-plugin.py --binary "target/$RELEASE_TARGET/debug/kubectl-view_storage"
          python3 -m pip install jsonschema==4.26.0
          python3 scripts/validate-produced-reports.py artifacts/api-reports
          python3 scripts/validate-produced-reports.py --http artifacts/http-reports
      - name: Fresh release build baseline and archive
        run: |
          python3 scripts/record-build-baseline.py --target "$RELEASE_TARGET" --runner "$RELEASE_TARGET" --require-fresh-profile
          python3 scripts/package-release.py archive --directory artifacts/release --target "$RELEASE_TARGET" --binary "target/$RELEASE_TARGET/release/kubectl-view_storage"
      - name: Verified source package and actual local Cargo installation
        run: |
          cargo package --locked --target "$RELEASE_TARGET"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          CARGO_TARGET_DIR="$PWD/target" cargo install --path "target/package/kubectl-view-storage-$version" --root .local/source-install --target "$RELEASE_TARGET" --locked --offline
          python3 scripts/check-plugin.py --binary .local/source-install/bin/kubectl-view_storage
          python3 scripts/test-credential-terminal.py --binary .local/source-install/bin/kubectl-view_storage --evidence-directory artifacts/source-install-authentication
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-binary-${{ matrix.target }}
          path: artifacts/release/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
  manifest:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-binary-*
          path: artifacts/release
          merge-multiple: true
      - name: Generate only from all four actual archives
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/package-release.py manifest --directory artifacts/release --repository-url "https://github.com/$RELEASE_REPOSITORY"
          python3 scripts/package-release.py verify --directory artifacts/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-local-release-set
          path: artifacts/release/
          if-no-files-found: error
  installed:
    needs: manifest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-local-release-set
          path: artifacts/release
      - name: Matching kubectl
        id: kubectl_pin
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('version=v'+json.load(open('dev/versions.json'))['kubectl']+'\n')
          PY
      - uses: azure/setup-kubectl@v5.2.0
        with:
          version: ${{ steps.kubectl_pin.outputs.version }}
      - name: Actual isolated Krew installation and installed command behavior
        run: |
          python3 scripts/test-smoke-http.py
          python3 scripts/fetch-krew.py
          python3 scripts/package-release.py smoke --directory artifacts/release --krew .local/tools/bin/kubectl-krew
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: installed-${{ matrix.target }}
          path: |
            artifacts/release/krew-smoke.json
            artifacts/release/installed-authentication/
          if-no-files-found: warn
