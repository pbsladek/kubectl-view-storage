name: Parser fuzzing
on:
  push:
    branches: [main]
    paths: ['src/qty.rs', 'src/transport.rs', 'src/metrics.rs', 'src/model.rs', 'src/work.rs', 'fuzz/**', 'Cargo.toml', 'Cargo.lock', 'scripts/fuzz-smoke.sh', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['src/**', 'fuzz/**', 'Cargo.toml', 'Cargo.lock', 'scripts/fuzz-smoke.sh']
  schedule:
    - cron: '43 10 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select pinned isolated fuzz compiler
        run: |
          python3 - <<'PY'
          import os, tomllib
          nightly = tomllib.load(open('fuzz/rust-toolchain.toml', 'rb'))['toolchain']['channel']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUSTUP_TOOLCHAIN=' + nightly + '\n')
          PY
      - name: Install pinned nightly
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup show active-toolchain
      - uses: ./.github/actions/rust-cache
        with:
          group: fuzz-asan
          workspaces: 'fuzz -> target'
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-fuzz
          version: '0.13.2'
      - name: Bounded fuzz runs
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '15' }}
        run: sh scripts/fuzz-smoke.sh
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-regressions
          path: fuzz/artifacts
          retention-days: 7
          if-no-files-found: warn
