apiVersion: v1
kind: Namespace
metadata:
  name: view-storage-test
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: view-storage-local
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: view-storage-test
  labels: {app: storage-fixture}
spec:
  storageClassName: view-storage-local
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unreferenced
  namespace: view-storage-test
spec:
  storageClassName: view-storage-static
  volumeName: view-storage-unreferenced
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pending
  namespace: view-storage-test
spec:
  storageClassName: deliberately-unavailable
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classless
  namespace: view-storage-test
spec:
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: view-storage-test
  labels: {app: different-pod-label}
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: data}
