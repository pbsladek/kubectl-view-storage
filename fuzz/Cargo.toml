[package]
name = "kubectl-view-storage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
kubectl-view-storage = { path = ".." }

[[bin]]
name = "quantity"
path = "fuzz_targets/quantity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "statistics"
path = "fuzz_targets/statistics.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
